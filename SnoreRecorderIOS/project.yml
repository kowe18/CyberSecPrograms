name: SnoreRecorder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SnoreRecorder:
    type: application
    platform: iOS
    sources: [SnoreRecorder]
    info:
      path: SnoreRecorder/Info.plist
      properties:
        CFBundleDisplayName: Hrkanje
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Aplikacija preko noći sluša mikrofon da bi prepoznala i snimila hrkanje."
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.snorerecorder
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
