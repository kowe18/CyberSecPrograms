name: Build iOS IPA (unsigned)

on:
  push:
    paths:
      - "SnoreRecorderIOS/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: SnoreRecorderIOS
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project SnoreRecorder.xcodeproj \
            -target SnoreRecorder \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SnoreRecorder.app Payload/
          zip -qry SnoreRecorder.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SnoreRecorder-ipa
          path: SnoreRecorderIOS/SnoreRecorder.ipa
          retention-days: 90
